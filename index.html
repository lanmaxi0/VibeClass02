<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현재 날짜와 시간</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f8; color: #17243b; font-family: system-ui, sans-serif; }
    main { width: min(90%, 540px); padding: 48px 24px; border-radius: 24px; background: white; text-align: center; box-shadow: 0 16px 48px #17243b12; }
    h1 { margin: 0 0 28px; font-size: 20px; }
    #date { margin: 0 0 12px; font-size: clamp(18px, 4vw, 24px); }
    #time { display: block; font-size: clamp(40px, 10vw, 64px); font-weight: 700; font-variant-numeric: tabular-nums; }
    .note { margin: 24px 0 0; color: #68758a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1></h1>
    <p id="date"></p>
    <time id="time"></time>
    <p class="note">현지 시간 기준</p>
  </main>
  <script>
    const dateElement = document.getElementById('date');
    const timeElement = document.getElementById('time');
    const dateFormatter = new Intl.DateTimeFormat('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    const timeFormatter = new Intl.DateTimeFormat('ko-KR', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });

    function updateClock() {
      const now = new Date();
      dateElement.textContent = dateFormatter.format(now);
      timeElement.textContent = timeFormatter.format(now);
      timeElement.dateTime = now.toISOString();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
